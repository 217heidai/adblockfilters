name: Generate Blacklist
on: 
  workflow_dispatch:
  schedule:
  - cron: 0 1 * * *

env:
  TZ: Asia/Shanghai
  SMARTDNS_URL: https://github.com/pymumu/smartdns/releases/download/Release46.1/smartdns-x86_64
  SMARTDNS_PATH: /tmp/smartdns
  DB_URL: https://github.com/217heidai/adblockfilters/releases/download/domain/domain.db

jobs:
  Generate_Blacklist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          sudo timedatectl set-timezone "$TZ"
          python -m pip install --upgrade pip
          pip install -U tld IPy dnspython httpx loguru
      
      - name: Setup SmartDNS
        run: |
          mkdir -p $SMARTDNS_PATH
          wget $SMARTDNS_URL -O $SMARTDNS_PATH/smartdns
          chmod +x $SMARTDNS_PATH/smartdns
          cp smartdns.conf $SMARTDNS_PATH/smartdns.conf
          nohup $SMARTDNS_PATH/smartdns -f -x -c $SMARTDNS_PATH/smartdns.conf > /dev/null 2>&1 &
          # 等 SmartDNS 就绪（最多 30 秒）：发一个真实 DNS 查询，收到任何响应即就绪
          ready=0
          for i in $(seq 1 30); do
            if python3 -c "import socket,sys; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(bytes.fromhex('00000100000100000000000003777777076578616d706c6503636f6d0000010001'),('127.0.0.1',5053)); s.recvfrom(1024); sys.exit(0)" 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" = "0" ]; then echo "SmartDNS not ready after 30s"; exit 1; fi

      - name: Download DB
        run: |
          # 三级兜底：fork 自身 release（fork 复制资产/自更新）→ 上游源仓库 → 空文件（空 sqlite 库可正常初始化）
          curl -fsSL --retry 3 -o domain.db \
            "https://github.com/${{ github.repository }}/releases/download/domain/domain.db" \
            || curl -fsSL --retry 3 -o domain.db "$DB_URL" \
            || : > domain.db

      - name: Download domain list
        run: |
          curl -fsSL --retry 3 -o domain.txt \
            "https://github.com/${{ github.repository }}/releases/download/domain/domain.txt" \
            || curl -fsSL --retry 3 -o domain.txt \
              "https://github.com/217heidai/adblockfilters/releases/download/domain/domain.txt" \
            || : > domain.txt

      - name: Generate Blacklist
        id: update
        run: |
          set -o pipefail
          python blacklist.py 2>&1 | tee blacklist.log
          rm -rf __pycache__
          echo "message=$(date)" >> $GITHUB_OUTPUT

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blacklist-log
          path: blacklist.log

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: domain
          files: |
            domain.db
            black.txt
            china.txt
          overwrite_files: true

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 5
